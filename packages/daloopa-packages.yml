description: >-
  Daloopa publishes NO conventional client SDK in any language package registry. It distributes its
  first-party client-side software through three non-registry channels instead: agent plugins on GitHub,
  an Office add-in through Microsoft AppSource, and native data shares through cloud marketplaces. This
  artifact records what exists and, just as importantly, what does not.

