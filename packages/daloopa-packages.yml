  finding: >-
    Zero first-party packages in any language registry. A developer integrating the REST API writes raw
    HTTP. Given that the API is a straightforward Basic-auth REST surface with an anonymously readable
    OpenAPI at https://app.daloopa.com/swagger.json, a generated SDK is cheap for Daloopa to ship and its
    absence is a real DX gap — but it is an honest absence, not an abandoned SDK.

