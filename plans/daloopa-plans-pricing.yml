- id: BASE
  source: 'POST /api/v3/partnerships/user (plan enum)'
  price: null
  note: Determines the monthly datapoint limit for a partner-provisioned trial pre-account. No price published.
- id: PLUS
  source: 'POST /api/v3/partnerships/user (plan enum)'
  price: null
  note: Higher monthly datapoint limit than BASE. No price published.

probe_evidence:
