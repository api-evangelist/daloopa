provider: Daloopa
providerId: daloopa
description: >-
  Daloopa publishes NO public pricing. There is no pricing page, no plan tiers, no rate card and no
  self-serve checkout anywhere on the marketing site, the docs, or the app. Access is sold through a
  demo/sales motion and priced by contract. This is recorded as an explicit zero rather than omitted, so
  the absence is legible as a checked fact.

plan_count: 0
public_pricing: false
self_serve_signup: false
free_tier: false
trial:
  public: false
  note: >-
    A trial mechanism EXISTS but is partner-mediated, not public. POST /api/v3/partnerships/user creates a
    partnership pre-account under an authenticated partner's program, with a monthly datapoint limit set
    by a chosen plan of BASE or PLUS, and the pre-account expires 30 days after creation. This is the only
    place in Daloopa's entire public surface where named plan identifiers appear.

plans: []

