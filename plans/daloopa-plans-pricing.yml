- {url: 'https://daloopa.com/contact', status: 200, note: 'redirects to https://daloopa.com/demo'}
- {url: 'https://daloopa.com/demo', status: 200}
- {url: 'https://daloopa.com/sitemap_index.xml', status: 200, note: 'full page sitemap enumerated; contains no pricing or plans page'}

metering_model:
  unit: datapoints
  period: monthly
  note: >-
    Although prices are unpublished, the METERING model is fully documented and machine-readable, which is
    more than most enterprise-priced vendors expose. GET /api/v3/consumption returns monthly_limit — either
    the numeric cap or the literal string 'Unlimited' — alongside consumption for the window. Per-company
    series access is separately capped and readable via GET /api/v3/consumption/series-access. A customer
    can therefore see exactly what they are burning against their contracted limit at runtime, even though
    they cannot see what it costs.
  operations:
  - get_datapoint_consumption
  - list_datapoint_access_events
  - get_series_consumption
  - list_accessed_companies
  docs: https://docs.daloopa.com/docs/checking-consumption
  secondary_limit:
    name: subscription slots
    note: >-
      Company subscriptions are capped per user. bulk_add_data_warehouse_company_subscription honors the
      remaining slot count and returns overflow in skipped_limit_exceeded rather than failing.

sales_motion:
  entry_points:
  - {name: Request a demo, url: 'https://daloopa.com/demo'}
  - {name: Sales, email: sales@daloopa.com}
  segments: [hedge funds, mutual funds, investment banking, equity research, private equity]

finding: >-
  The gap is disclosure, not instrumentation. Daloopa built the consumption API a metered customer needs
  and documented it well, then published no price for the thing being metered. An agent or a buyer can
  answer "how much have I used" precisely and "what will this cost" not at all.

