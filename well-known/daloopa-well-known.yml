findings:
- >-
  No security.txt on any host. Daloopa runs a Vanta trust center at trust.daloopa.com but publishes no
  RFC 9116 machine-readable security contact, so an automated scanner has nowhere to look. This is the
  cheapest unclaimed win on the profile.
- >-
  No A2A agent card on any host, at either the canonical /.well-known/agent-card.json path or the legacy
  /.well-known/agent.json path. No AgentCard pointer is emitted.
- >-
  The MCP OAuth discovery chain is complete and correct: the 401 challenge names the protected-resource
  document, which names the authorization server, which advertises a registration endpoint and PKCE S256.
  An MCP client can bootstrap from a cold start with no out-of-band configuration.

