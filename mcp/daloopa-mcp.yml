      Apps directory verification surface.
  docs: https://docs.daloopa.com/docs/mcp-integrations
partnerships:
  docs: https://docs.daloopa.com/docs/partnerships
  note: Partner-only workflow for provisioning trial accounts for Daloopa MCP users, backed by POST /api/v3/partnerships/user
    with BASE or PLUS monthly datapoint limits. Pre-accounts expire 30 days after creation.
source_attribution:
  note: Documented differentiator — "source location mapped to every output derived from a Daloopa datapoint".
    Every value an agent returns can be traced to the exact spot in the originating SEC filing.
