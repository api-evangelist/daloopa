tool_count: 9
tools_source: https://docs.daloopa.com/docs/daloopa-mcp (Available Tools section)
tools:
- name: discover_companies
  category: discovery
  description: Locates companies within the Daloopa financial database by searching with either stock
    ticker symbols or company names. Returns the ticker symbol, complete corporate name, and unique company
    identifier required for accessing detailed financial data.
- name: discover_company_series
  category: discovery
  description: Retrieves the available financial metrics and data series for a specified company, filtered
    by keyword and time period. Displays all matching financial series along with their corresponding
    metric IDs, enabling targeted data extraction.
- name: discover_company_documents
  category: documents
  description: Lists the financial documents Daloopa has indexed for a company within specified calendar
    quarters — 10-K, 10-Q and 8-K filings, earnings transcripts, news articles and company presentations.
    Each result returns its filing type, filing date, title and a unique document identifier.
- name: get_company_fundamentals
  category: fundamentals
  description: Extracts comprehensive financial fundamentals for a company across selected time periods
    and specific metrics — income statements, balance sheets, cash flow statements and additional financial
    metrics.
- name: get_document_content
  category: documents
  description: Retrieves the full processed text of a Daloopa-indexed document by identifier. Large filings
    are divided into named sections so a specific section (for example Risk Factors or MD&A) can be requested
    without returning the entire filing.
- name: search_documents
  category: documents
  description: Searches financial filings, transcripts and company presentations using keyword matching
    to extract qualitative insights across selected time periods — management commentary, forward guidance,
    risk factors and strategic initiatives.
- name: get_stock_prices
  category: market_data
  description: Retrieves daily OHLCV stock price data for one or more companies across a date or date
    range, enabling trading-multiple calculations (P/E, EV/EBITDA, Price/Book) and price performance analysis.
- name: list_skills
  category: skills
  description: Lists every available investing skill — the structured analysis, valuation and deliverable
    workflows Daloopa provides. Each entry returns the skill's slug, title, a description of what it produces,
    and the inputs it requires.
- name: get_skill
  category: skills
  description: Fetches the full instructions for a single investing skill with the caller's inputs substituted
    in, returning a complete skill template ready to follow.
prompts:
  published: true
  docs: https://docs.daloopa.com/docs/mcp-prompts
  note: Daloopa publishes its MCP tool prompts explicitly "for developers that are interested in building
    their own MCP on top of Daloopa's APIs" — instructions to the LLM covering financial comparisons,
    data presentation formatting and multi-step analytical processes. Publishing the prompt layer rather
    than only the tool list is uncommon and materially useful to anyone integrating.
skills_surface:
  note: The skills exposed through list_skills / get_skill are the SAME investing skills served over REST
    at GET /api/v3/investing-skills, and they overlap with the 21 Agent Skills Daloopa publishes as an
    open-source Claude Code plugin. Three delivery channels, one skill catalog.
  rest_operations:
  - list_investing_skills
  - retrieve_investing_skill
  packaged_skills: skills/_index.yml
integrations:
