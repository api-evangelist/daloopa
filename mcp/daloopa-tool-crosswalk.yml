findings:
- id: read-only-agent-surface
  statement: >-
    The MCP surface is entirely READ-ONLY. All 15 write/management operations in the REST API — webhook
    CRUD, Snowflake/Databricks subscription writes, partnership user creation — are absent from the tool
    list. This looks deliberate rather than incomplete, and it is the right call for a financial data
    vendor: an agent can read everything it is entitled to and change nothing.
- id: no-mcp-only-tools
  statement: >-
    Every MCP tool maps to a real public REST operation. There are no composite or MCP-exclusive tools
    whose contract exists only behind the gated tools/list. The REST OpenAPI is therefore a complete and
    trustworthy description of what the agent surface can actually do, which is unusual — most hosted MCP
    servers in the catalog have at least some tools with no public REST equivalent.
- id: metering-not-exposed
  statement: >-
    The consumption endpoints are REST-only. An agent burning datapoints against a metered plan cannot ask
    the MCP server how much budget it has left; only the human's integration code can. Given that Daloopa
    meters on datapoints consumed and that agents are exactly the class of consumer that will fan out
    unpredictably, exposing get_datapoint_consumption as a tool would be the single highest-value addition
    to the tool list.
- id: freshness-not-exposed
  statement: >-
    check_company_status — the documented cache-invalidation primitive — is REST-only. An agent cannot ask
    whether the data it is about to summarize has been restated since it last looked.
- id: skills-as-tools
  statement: >-
    list_skills / get_skill make the analytical workflow itself a retrievable object over MCP. The same
    catalog is served over REST and published as 21 open-source SKILL.md files. Daloopa ships the same
    skill catalog through three channels, which is a coherent agent strategy rather than three
    disconnected surfaces.

