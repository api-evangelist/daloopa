crosswalk:
- tool: discover_companies
  category: discovery
  rest: [companies_list_v3]
  binding: rest
  confidence: high
  note: >-
    Docs describe searching by ticker or name and returning ticker, name and company_id — exactly the
    shape of GET /api/v3/companies with its keyword filter. The tool also surfaces
    latest_calendar_quarter / latest_fiscal_quarter, which the published Agent Skills use as the anchor
    for all period math, and which the same operation returns.
- tool: discover_company_series
  category: discovery
  rest: [company_series_list, list_taxonomy_metrics_v3]
  binding: rest
  confidence: high
  note: >-
    Primary binding is GET /api/v3/companies/series (financial series for a company with filtering).
    Taxonomy metrics is the standardized-metric counterpart the docs describe as the way to find metric
    IDs across companies.
- tool: discover_company_documents
  category: documents
  rest: [company_document_lookup_v3]
  binding: rest
  confidence: high
  note: >-
    One-to-one. GET /api/v3/documents returns paginated documents for a company filtered by
    calendar_quarters or fiscal_quarters, with filing type, filing date, title and document id.
- tool: get_company_fundamentals
  category: fundamentals
  rest: [get_company_fundamentals_v3, get_fundamentals_series, get_fundamental_updates]
  binding: rest
  confidence: high
  note: >-
    Primary is GET /api/v3/companies/fundamentals. get_fundamentals_series resolves series context for up
    to 100 fundamental IDs; get_fundamental_updates provides the since-timestamp delta. The tool composes
    across these rather than mapping to one.
- tool: get_document_content
  category: documents
  rest: [retrieve_document_content, retrieve_document_metadata, retrieve_document]
  binding: rest
  confidence: high
  note: >-
    Composite. The tool's described behavior — return processed text, with large filings divided into
    named sections so a specific section can be requested — is exactly the
    /content + /metadata pair. /metadata returns the section list and the recommended_call hint;
    /content returns the text with a 100000-character cap unless full_content=true. The bare
    GET /documents/{id} returns a signed URL to the original file.
- tool: search_documents
  category: documents
  rest: [opensearch_lightweight_search_v3]
  binding: rest
  confidence: high
  note: >-
    POST /api/v3/documents/keyword-search. This is also the mandated fallback for earnings call
    transcripts, which are excluded from whole-document access and return 403 on get_document_content.
- tool: get_stock_prices
  category: market_data
  rest: [get_company_market_data, get_company_adjustment_factors]
  binding: rest
  confidence: high
  note: >-
    GET /api/v3/companies/{company_id}/stock-prices returns daily OHLCV. Adjustment factors is the
    corporate-action companion needed for a correct split/dividend-adjusted series; the docs describe the
    tool as supporting multiple calculations, which requires it.
- tool: list_skills
  category: skills
  rest: [list_investing_skills]
  binding: rest
  confidence: high
  note: >-
    GET /api/v3/investing-skills returns the catalog of investing skills with slug, title, description and
    declared inputs — field-for-field what the tool is documented to return.
- tool: get_skill
  category: skills
  rest: [retrieve_investing_skill]
  binding: rest
  confidence: high
  note: >-
    GET /api/v3/investing-skills/{investing_skill_name} returns a single skill's full prompt content,
    declared inputs and required tools. The MCP tool adds caller-input substitution on top.

