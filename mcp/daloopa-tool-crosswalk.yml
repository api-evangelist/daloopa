generated: '2026-08-11'
method: derived
source: >-
  Derived by binding the nine published MCP tools (mcp/daloopa-mcp.yml, transcribed from
  https://docs.daloopa.com/docs/daloopa-mcp) to the 41 operations in the live REST OpenAPI
  (openapi/daloopa-api-openapi.yml, harvested from https://app.daloopa.com/swagger.json).
purpose: >-
  Make the MCP tool a first-class discovery unit bound to its backing REST operation. Daloopa is an
  unusually clean case: the MCP server is a deliberately NARROWED projection of the REST API — nine
  read-oriented tools over 41 operations — and every tool maps to a real, publicly documented REST
  operation. Nothing in the MCP surface is invented; the interesting finding is what was left OUT.

surfaces:
  rest_openapi:
    path: openapi/daloopa-api-openapi.yml
    source: https://app.daloopa.com/swagger.json
    gated: false
    note: >-
      The spec itself is served ANONYMOUSLY at the API host root (200, 182KB, OpenAPI 3.0.3) even though
      every operation requires credentials. 41 operations, 38 paths, 16 tags.
  mcp:
    url: https://mcp.daloopa.com/server/mcp
    gated: true
    note: >-
      tools/list returns 401 with a spec-compliant OAuth challenge. Tool names and descriptions come from
      the published docs; live inputSchema requires authenticated introspection.
  mcp_service_openapi:
    path: openapi/daloopa-mcp-service-openapi.json
    source: https://mcp.daloopa.com/openapi.json
    gated: false
    note: Auth/consumption/discovery endpoints surrounding the MCP transport, not the tools themselves.
  graphql: null

