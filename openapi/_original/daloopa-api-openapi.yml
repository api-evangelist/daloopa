    DocumentContentResponse:
      type: object
      description: |-
        Flat response for GET /api/v2/documents/{id}/content.

        The shape is intentionally narrow: just enough for the caller to use
        the text. Section-level metadata (the available section list, the
        recommended_call hint) is the responsibility of the /metadata
        endpoint; the caller already knows which section it asked for.
      properties:
        document_id:
          type: integer
          description: Unique document identifier
        document_type:
          type: string
          description: Source document type classification carried alongside filing_type.
            Useful for disambiguating the broad Others filing bucket (for example
            Earnings Presentation, Investor Day Presentation, 6-K).
        filing_type:
          type: string
          description: Type of filing (10-K, 10-Q, 8-K, News Article, Others). Transcripts
            are blocked on this endpoint and return 403; use /documents/keyword-search
            for transcript content.
        content:
          type: string
          description: Document text. Capped at max_characters unless full_content=true.
            When section is provided, contains just that section's text.
        number_of_characters:
          type: integer
          description: Number of characters in the returned content.
        truncated:
          type: boolean
          description: True when the resolved text was longer than max_characters
            and the response was sliced. Always false when full_content=true.
      required:
      - content
      - document_id
      - document_type
      - filing_type
      - number_of_characters
      - truncated
    DocumentMetadataResponse:
      type: object
      description: |-
        Serializer for the GET /api/v2/documents/{id}/metadata response.

        Surfaces structural metadata only: document identity, filing type,
        section breakdown with character counts, and a ``recommended_call``
        hint that downstream callers (REST /content, get_document_content
        MCP tool) consume to decide what to retrieve next.
      properties:
        document_id:
          type: integer
          description: Unique document identifier
        company_id:
          type: integer
          nullable: true
          description: Id of the company the document belongs to. Resolved from the
            document's direct company with a fallback to its company identifier for
            older rows. Callers use it to attribute document access to a company (access
            control and subscription).
        title:
          type: string
          description: Human-readable document title
        filing_type:
          type: string
          description: Type of filing (10-K, 10-Q, 8-K, News Article, Others). Transcripts
            are blocked on this endpoint and return 403; use /documents/keyword-search
            for transcript content.
        document_type:
          type: string
          description: Source document type classification carried alongside filing_type.
            Useful for disambiguating the broad Others filing bucket (for example
            Earnings Presentation, Investor Day Presentation, 6-K).
        total_characters:
          type: integer
          description: Total number of characters in the document text. 0 when not_supported.
        total_sections:
          type: integer
          description: Number of named sections in the document. 0 when not_supported.
        available_sections:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSection'
          description: Named sections with character counts. Empty when not_supported.
        recommended_call:
          allOf:
          - $ref: '#/components/schemas/RecommendedCallEnum'
          description: |-
            Hint for the next call. small_full and large_with_section apply to 10-K and 10-Q. single_section_filing applies to 8-K, News Article, and Others. not_supported applies to filing types outside the allowlist; Transcript filings reach this endpoint but are blocked with 403 before the service runs.

            * `small_full` - small_full
            * `large_with_section` - large_with_section
            * `single_section_filing` - single_section_filing
            * `not_supported` - not_supported
        reason:
          type: string
          nullable: true
          description: Populated when recommended_call is not_supported.
      required:
      - available_sections
      - company_id
      - document_id
      - document_type
      - filing_type
      - recommended_call
      - title
      - total_characters
      - total_sections
    DocumentMetadataSerializerV3:
      type: object
      description: |-
        V3 document metadata response serializer.

        Same shape as :class:`DocumentMetadataSerializer` but without the deprecated
        ``period`` output field. Kept as a standalone class so it is trivial to
