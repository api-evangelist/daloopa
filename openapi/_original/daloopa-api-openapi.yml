      - plan
    PatchedWebhookUpdateRequest:
      type: object
      description: |-
        Validates the payload for updating an existing webhook (PATCH).

        All fields are optional, but at least one must be provided.
      properties:
        url:
          type: string
          format: uri
          minLength: 1
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        is_test:
          type: boolean
        active:
          type: boolean
        header_name:
          type: string
          minLength: 1
        prefix:
          type: string
          minLength: 1
        auth_secret:
          type: string
          minLength: 1
    PlanEnum:
      enum:
      - BASE
      - PLUS
      type: string
      description: |-
        * `BASE` - BASE
        * `PLUS` - PLUS
    RecommendedCallEnum:
      enum:
      - small_full
      - large_with_section
      - single_section_filing
      - not_supported
      type: string
      description: |-
        * `small_full` - small_full
        * `large_with_section` - large_with_section
        * `single_section_filing` - single_section_filing
        * `not_supported` - not_supported
    SeriesConsumption:
      type: object
      properties:
        company_id:
          type: integer
          readOnly: true
        current_series_per_company_limit:
          type: string
          nullable: true
          readOnly: true
        number_of_series_accessed_for_company:
          type: integer
          readOnly: true
        series_accessed:
          type: array
          items:
            $ref: '#/components/schemas/AccessedSeries'
          readOnly: true
      required:
      - company_id
      - current_series_per_company_limit
      - number_of_series_accessed_for_company
      - series_accessed
    TaxonomyIndustry:
      type: object
      properties:
        industry_id:
          type: integer
          description: IndustryClassification identifier for the industry
        name:
          type: string
          default: ''
          description: Display name of the industry using Global Industry Classification
            Standard (GICS)
        sector_id:
          type: integer
          description: Identifier of the parent sector
        sector_name:
          type: string
          default: ''
          description: Display name of the parent sector using Global Industry Classification
            Standard (GICS)
        companies:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyIndustryCompany'
          description: Companies that belong to the industry
      required:
      - companies
      - industry_id
      - sector_id
    TaxonomyIndustryCompany:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the company within the taxonomy result
        ticker:
          type: string
          description: Ticker symbol for the company within the taxonomy result
        name:
          type: string
          description: Company name displayed in the taxonomy result
      required:
      - id
      - name
      - ticker
    TaxonomyIndustryTemplate:
      type: object
      properties:
        industry_id:
          type: integer
          description: IndustryClassification identifier for this template
        name:
          type: string
          description: Display name of the Ops industry on the classification
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyIndustryTemplateSector'
          description: Ops sectors associated with the industry classification
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyIndustryTemplateMetric'
          description: Active template metric slots for the industry classification
      required:
      - industry_id
      - metrics
      - name
      - sectors
    TaxonomyIndustryTemplateMetric:
      type: object
      properties:
        taxonomy_metric_id:
          type: integer
          nullable: true
          description: Unique identifier of the linked TaxonomyKPI, if any
        taxonomy_metric_name:
          type: string
          nullable: true
          description: Display name of the linked TaxonomyKPI, if any
        category:
          type: string
          description: Template metric category label (e.g. KPI, Segments)
        series:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyIndustryTemplateSeries'
          description: Company series for this metric within the industry classification
      required:
      - category
      - series
      - taxonomy_metric_id
      - taxonomy_metric_name
    TaxonomyIndustryTemplateSector:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the sector
        name:
          type: string
          description: Display name of the sector using Global Industry Classification
            Standard (GICS)
      required:
      - id
      - name
    TaxonomyIndustryTemplateSeries:
      type: object
      properties:
        company_id:
          type: integer
          description: Identifier of the company the series belongs to
        company_ticker:
          type: string
          description: Ticker symbol of the company the series belongs to
        api_series_id:
          type: integer
          description: Identifier of the series associated with the metric
        full_series_name:
          type: string
          description: Full descriptive name of the series
      required:
      - api_series_id
      - company_id
      - company_ticker
      - full_series_name
    TaxonomyMetric:
      type: object
      properties:
        metric_id:
          type: integer
          description: Unique identifier for the taxonomy metric
        metric_name:
          type: string
          default: ''
          description: Human-readable name of the metric
        metric_description:
          type: string
          default: ''
          description: Description of what the metric represents
        global_metric:
          type: boolean
          default: false
          description: Indicates whether the metric is a global metric, meaning all
            companies should have this metric
        fallback_metric:
          type: integer
          nullable: true
          description: Alternative metric to query if this metric is unavailable for
            a company
        financial_statement_sections:
          type: array
          items:
            type: string
          description: Financial statement sections where this metric may appear (e.g.
            Income Statement, Balance Sheet)
      required:
      - metric_id
    TaxonomyMetricData:
      type: object
      properties:
        metric_id:
          type: integer
          description: Unique identifier for the taxonomy metric
        metric_name:
          type: string
          default: ''
          description: Human-readable name of the metric
        metric_description:
          type: string
          default: ''
          description: Description of what the metric represents
        global_metric:
          type: boolean
          default: false
          description: Indicates whether the metric is a global metric, meaning all
            companies should have this metric
        fallback_metric:
          type: integer
          nullable: true
          description: Alternative metric to query if this metric is unavailable for
            a company
        financial_statement_sections:
          type: array
          items:
            type: string
          description: Financial statement sections where this metric may appear (e.g.
            Income Statement, Balance Sheet)
        metric_series:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyMetricSeriesItem'
          description: Series where the metric appears, grouped by company
      required:
      - metric_id
      - metric_series
    TaxonomyMetricSeriesItem:
      type: object
      properties:
        company_id:
          type: integer
          description: Identifier of the company the series belongs to
        ticker:
          type: string
          description: Ticker symbol of the company the series belongs to
        series_id:
          type: integer
          description: Identifier of the series associated with the metric
        full_series_name:
          type: string
          description: Full descriptive name of the series
        is_fallback_series:
          type: boolean
          default: false
          description: Indicates whether the series is a fallback series for the metric
      required:
      - company_id
      - full_series_name
      - series_id
      - ticker
    TaxonomySector:
      type: object
      properties:
        sector_id:
          type: integer
          description: Unique identifier for the sector
        sector_name:
          type: string
          default: ''
          description: Display name of the sector using Global Industry Classification
            Standard (GICS)
        industries:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomySectorIndustry'
          description: Ops industries that belong to the sector
      required:
