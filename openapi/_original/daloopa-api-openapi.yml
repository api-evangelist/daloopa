  /api/v3/companies/status:
    post:
      operationId: check_company_status
      description: |-
        Check the data freshness signals for specified companies. Each company entry in the response distinguishes three timestamps:

        - `latest_datapoint_created_at`: when the latest publish notification for the company was created. Falls back to the company's live Excel model `created_at` when no active non-clientview notification exists.
        - `latest_datapoint_updated_at`: the latest data change for the company, computed as the max of the most recent DELETE event in FundamentalEventLog and the most recent incremental-update error in FundamentalErrors.
        - `model_updated_at`: when the company's Excel model was last touched.
      summary: Check Company Model Status
      tags:
      - Companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyStatusQueryRequest'
            examples:
              CheckMultipleCompanies:
                value:
                  companies:
                  - 1234
                  - 5678
                  - 9012
                summary: Check Multiple Companies
                description: Check status for multiple companies
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyStatusQueryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyStatusQueryRequest'
        required: true
      security:
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyStatus'
              examples:
                CheckMultipleCompanies:
                  value:
                  - companies:
                    - 1234
                    - 5678
                    - 9012
                  summary: Check Multiple Companies
                  description: Check status for multiple companies
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                  status_code:
                    type: integer
                  message:
                    type: string
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
