  /api/v3/webhooks/{webhook_id}/sample-payload:
    get:
      operationId: get_webhook_sample_payload
      description: 'Returns a sample payload matching the webhook''s configured event
        type. The payload uses static example data and includes ''test'': true. Fundamental
        events (clientview_updated, incremental_update, series_updated) carry a ''series''
        field; document_added carries a ''document'' object instead. Only the webhook
        owner can access this endpoint.'
      summary: Get Sample Payload for Webhook
      parameters:
      - in: path
        name: webhook_id
        schema:
          type: integer
        description: The ID of the webhook
        required: true
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  test:
                    type: boolean
                  event_type:
                    type: string
                  company_id:
                    type: integer
                  series:
                    type: object
                    description: Present for fundamental events.
                  document:
                    type: object
                    description: Present for document_added events. Carries the document's
                      raw filing_type and document_type exactly as returned by GET
                      /documents (no normalization).
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
  /api/v3/webhooks/{webhook_id}/test:
    post:
      operationId: test_webhook_delivery
      description: 'Triggers a synchronous test delivery to the webhook''s configured
        URL using a sample payload with ''test'': true. Returns immediate feedback
        including the HTTP status code, response body (truncated to 2000 chars), and
        round-trip duration in milliseconds. Only the webhook owner can trigger a
        test delivery. Uses a 10-second timeout.'
      summary: Test Webhook Delivery
      parameters:
      - in: path
        name: webhook_id
        schema:
          type: integer
        description: The ID of the webhook to test
        required: true
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status_code:
                    type: integer
                    nullable: true
                  response_body:
                    type: string
                  duration_ms:
                    type: integer
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
  /api/v3/webhooks/deliveries:
    get:
      operationId: list_webhook_deliveries
      description: 'Returns delivery history in reverse chronological order. Each
        entry includes the timestamp, event type, company ID, response status, response
        body (truncated to 1000 characters), test flag, and round-trip duration in
        milliseconds. Supports standard DRF limit/offset pagination (default page
        size: 500, max: 500). Optionally filter by webhook_id and/or is_test. Only
        deliveries for webhooks owned by the authenticated user are returned.'
      summary: List Webhook Delivery History
      parameters:
      - in: query
        name: is_test
        schema:
          type: boolean
        description: Filter by test (true) or production (false) deliveries
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum number of deliveries to return (default 500, max 500)
      - in: query
        name: offset
        schema:
          type: integer
        description: Number of deliveries to skip for pagination
      - in: query
        name: webhook_id
        schema:
          type: integer
        description: Filter deliveries to a specific webhook (optional)
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?offset=400&limit=100
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?offset=200&limit=100
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        count:
                          type: integer
                        next:
                          type: string
                          format: uri
                          nullable: true
                        previous:
                          type: string
                          format: uri
                          nullable: true
                        results:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              timestamp:
                                type: string
                                format: date-time
                              event_type:
                                type: string
                              company_id:
                                type: integer
                              response_status:
                                type: integer
                                nullable: true
                              response_body:
                                type: string
                                nullable: true
                              is_test:
                                type: boolean
                              duration_ms:
                                type: integer
                                nullable: true
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
  /api/v3/partnerships/user:
    post:
      operationId: create_partnership_user
      description: Create a partnership pre-account for the given email under the
        authenticated API key's partnership program. A sign-up email is sent to the
        user with a link to complete account creation. The pre-account expires 30
        days after creation. The monthly datapoint limit is determined by the chosen
        plan (BASE or PLUS).
      summary: Create Partnership User
      tags:
      - Partnership
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnershipUserCreationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PartnershipUserCreationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PartnershipUserCreationRequest'
        required: true
      security:
      - apiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    format: email
                    description: Email of the created partnership user.
                  plan:
                    type: string
                    enum:
                    - BASE
                    - PLUS
                    description: Plan assigned to the partnership user.
                  expires_at:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp when the pre-account expires.
                example:
                  email: user@example.com
                  plan: PLUS
                  expires_at: '2026-06-06T12:00:00+00:00'
                description: Partnership user successfully created.
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                  status_code:
                    type: integer
                  message:
                    type: string
                example:
                  error:
                    detail: A user with this email already exists
                  status_code: 400
                  message: Invalid parameters
                description: Invalid input parameters, or a user/pre-account with
                  the given email already exists.
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                example:
                  detail: Invalid or missing API key.
                description: Authentication credentials were not provided or are invalid.
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                  status_code:
                    type: integer
                  message:
                    type: string
                example:
                  error: Partnership user limit of 10000 exceeded for this API key.
                  status_code: 403
                  message: Permission denied
                description: Partnership user limit exceeded for this API key.
          description: ''
components:
  schemas:
    AccessedCompany:
      type: object
      properties:
        company_id:
          type: integer
          description: Identifier of the company the user has accessed
        company_name:
          type: string
          nullable: true
          description: Name of the company
        ticker:
          type: string
          nullable: true
          description: Ticker symbol of the company
        first_accessed_at:
          type: string
          format: date-time
          description: Timestamp of the first time the user accessed the company
      required:
      - company_id
      - company_name
      - first_accessed_at
      - ticker
    AccessedSeries:
      type: object
      properties:
        series_id:
          type: integer
          readOnly: true
        full_series_name:
          type: string
          readOnly: true
      required:
      - full_series_name
      - series_id
    AdjustmentFactors:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ex_date:
          type: string
          format: date
          description: Date the adjustment takes effect; the factor applies to prices
            strictly before this date
        factor:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,6})?$
          description: Multiplier for historical prices before the ex date
        factor_type:
          allOf:
          - $ref: '#/components/schemas/FactorTypeEnum'
          description: |-
            One of split, cash_dividend, spin_off, or other

            * `split` - Split
            * `cash_dividend` - Cash Dividend
            * `spin_off` - Spin Off
            * `other` - Other
        event:
          type: string
          description: Corporate action event code (e.g. SD, DIV, DMRGR)
          maxLength: 32
        detail:
          type: string
          description: Human-readable description of the corporate action
          maxLength: 1024
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event
      - ex_date
      - factor
      - factor_type
      - id
      - updated_at
    BatchSearchFiltersSerializerV3Request:
      type: object
      description: |-
        V3 batch-search filters.

        Same shape as :class:`BatchSearchFiltersSerializer` but without the deprecated
        ``periods`` field (and thus no ``LegacyFieldAliasMixin``). Kept as a standalone
        class so it is trivial to delete once v2 is sunset.
      properties:
        company_ids:
          type: array
          items:
            type: integer
          description: List of company IDs to filter by
        document_ids:
          type: array
          items:
            type: integer
          description: List of document IDs to filter by
        filing_types:
          type: array
          items:
            type: string
            minLength: 1
          description: List of filing types to filter by (e.g., '10-K', '10-Q')
        date_range:
          type: object
          additionalProperties: {}
          description: Date range filter with 'start' and 'end' keys (YYYY-MM-DD format)
        calendar_quarters:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 10
          description: One or more calendar quarters in YYYYQ# format. Mutually exclusive
            with `fiscal_quarters`.
        fiscal_quarters:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 10
          description: One or more fiscal quarters in YYYYQ# format. Translated to
            each company's calendar quarters before filtering, so `company_ids` is
            required. Mutually exclusive with `calendar_quarters`.
    BatchSearchOptionsRequest:
      type: object
      description: Serializer for batch search options.
      properties:
        size:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
          description: Maximum number of documents to return per page (1-100)
        offset:
          type: integer
          minimum: 0
          default: 0
          description: 'Number of documents to skip for pagination (default: 0)'
        operator:
          allOf:
          - $ref: '#/components/schemas/OperatorEnum'
          default: OR
          description: |-
            Search operator - 'AND' requires all keywords, 'OR' requires any keyword

            * `AND` - AND
            * `OR` - OR
        fuzzy:
          type: boolean
          default: false
          description: 'Enable fuzzy matching (default: False). When False, only exact
            phrase matches are returned. When True, allows approximate matches but
            positional information may be unavailable.'
    BatchSearchRequestSerializerV3Request:
      type: object
      description: |-
        V3 batch-search request.

        Same shape as :class:`BatchSearchRequestSerializer` but nests the v3 filters
        serializer, which drops the deprecated ``periods`` field.
      properties:
        keywords:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: List of keywords to search for (1-10 keywords)
          maxItems: 10
          minItems: 1
        filters:
          allOf:
          - $ref: '#/components/schemas/BatchSearchFiltersSerializerV3Request'
          description: Optional filters for document selection
        options:
          allOf:
          - $ref: '#/components/schemas/BatchSearchOptionsRequest'
          description: Optional search options
      required:
      - keywords
    BulkCompanySubscriptionQueryRequest:
      type: object
      properties:
        company_ids:
          type: array
          items:
            type: integer
      required:
      - company_ids
    Company:
      type: object
      description: Company serializer with industry, sector and companyidentifier_set
        as additional fields.
      properties:
        id:
          type: integer
          readOnly: true
          description: Unique identifier for the company
        name:
          type: string
          nullable: true
          description: Registered name of the company
          maxLength: 255
        ticker:
          type: string
          nullable: true
          description: Primary ticker symbol used to identify the company
          maxLength: 255
        industry_:
          type: string
          nullable: true
          readOnly: true
          title: 'Industry '
          description: Name of the industry the company belongs to
        sector_:
          type: string
          nullable: true
          readOnly: true
          title: 'Sector '
          description: Name of the sector the company belongs to
        actively_maintained:
          type: boolean
        companyidentifier_set:
          type: array
          items:
            $ref: '#/components/schemas/CompanyIdentifier'
          readOnly: true
          description: Alternate identifiers associated with the company (e.g., ISIN,
            CIK)
        model_updated_at:
          type: string
          format: date-time
          description: Timestamp when the company's model was last updated
        earliest_calendar_quarter:
          type: string
          nullable: true
          readOnly: true
          description: Earliest calendar quarter available in the company's model
        latest_calendar_quarter:
          type: string
          nullable: true
          readOnly: true
          description: Most recent calendar quarter available in the company's model
        earliest_fiscal_quarter:
          type: string
          nullable: true
          readOnly: true
          description: Earliest fiscal quarter available in the company's model
        latest_fiscal_quarter:
          type: string
          nullable: true
          readOnly: true
          description: Most recent fiscal quarter available in the company's model
      required:
      - companyidentifier_set
      - earliest_calendar_quarter
      - earliest_fiscal_quarter
      - id
      - industry_
      - latest_calendar_quarter
      - latest_fiscal_quarter
      - model_updated_at
      - sector_
    CompanyIdentifier:
      type: object
      properties:
        identifier_type:
          allOf:
          - $ref: '#/components/schemas/IdentifierTypeEnum'
          description: |-
            Type of identifier (e.g., ISIN, CIK, ticker)

            * `CIK` - Identifier used by SEC
            * `ISIN` - International Securities Identification Number
            * `CUSIP` - US and Canada
            * `SEDOL` - UK and Ireland
            * `FIGI` - Bloomberg
            * `PRIVATE` - private company data with public identifiers
            * `CompanyHouseId` - company house identifier
            * `CapIQCompanyId` - CapIQ Company identifier
            * `CapIQCompanyTicker` - CapIQ Company Ticker
            * `ASXCode` - Australian Securities Exchange Company Identifier
        identifier_value:
          type: string
          nullable: true
          description: Identifier value corresponding to the identifier type
          maxLength: 255
      required:
      - identifier_type
    CompanyIndustryModel:
      type: object
      properties:
        company_id:
          type: integer
          description: Identifier for the company associated with the industry models
        isin:
