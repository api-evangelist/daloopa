  /api/v3/documents/{document_id}/content:
    get:
      operationId: retrieve_document_content
      description: Return the processed flat text of a supported document (10-K, 10-Q,
        8-K, News Article, Others). The response is a flat shape with no pagination
        and no section list; callers that need the section list or the recommended_call
        hint use the /metadata endpoint, and callers that need the original document
        file use GET /api/v2/documents/{id}. By default the response is capped at
        max_characters (100000) and truncated=true is set when the cap is hit. Pass
        full_content=true to bypass the cap. Filing types outside the allowlist return
        400 with a reason; an unknown section name returns 400 with the available_sections
        list so the caller can recover. Earnings call transcripts are excluded from
        whole-document access and return 403; use /documents/keyword-search to query
        transcript content.
      summary: Retrieve Document Content
      parameters:
      - in: path
        name: document_id
        schema:
          type: integer
        description: The unique identifier of the document.
        required: true
        examples:
          DocumentID:
            value: 12345
            summary: Document ID
            description: Example document ID
      - in: query
        name: full_content
        schema:
          type: boolean
        description: When true, max_characters is ignored and the full text (or full
          section) is returned with truncated=false.
      - in: query
        name: max_characters
        schema:
          type: integer
        description: Cap on returned characters. Defaults to 100000. Hard ceiling
          is 1000000; values above the ceiling are rejected. When the resolved text
          is longer than max_characters, the first max_characters are returned and
          truncated is set to true.
      - in: query
        name: section
        schema:
          type: string
        description: Optional section name from the document's section index. When
          provided, only that section's text is returned. Use GET /api/v2/documents/{id}/metadata
          to discover valid section names.
      tags:
      - Documents
      security:
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentContentResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  reason:
                    type: string
                  available_sections:
                    type: array
                    items:
                      type: string
                  details:
                    type: object
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
        '403':
