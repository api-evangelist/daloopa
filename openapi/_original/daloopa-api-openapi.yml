        * `incremental_update` - Incremental Update
        * `series_updated` - Series Updated
        * `document_added` - Document Added
    ExportModelSerializerV3:
      type: object
      description: |-
        V3 export query serializer.

        Same shape as :class:`ExportModelSerializer` but ``output_format`` defaults to
        ``parquet`` instead of ``csv`` — v3 returns Parquet by default and callers opt
        into CSV with ``output_format=csv``.
      properties:
        real_time:
          type: boolean
          default: false
          description: If True, returns data that is incrementally updated and not
            yet available in the datasheet. If False, uses the last published snapshot.
        show_historical_data:
          type: boolean
          default: false
          description: Should be used with real_time=True. If True, returns data available
            in datasheet plus incrementally updated data. If False, returns just the
            incrementally updated data.
        output_format:
          allOf:
          - $ref: '#/components/schemas/OutputFormatEnum'
          default: parquet
          description: |-
            Output file format. Either 'csv' or 'parquet'. Defaults to 'parquet'.

            * `csv` - csv
            * `parquet` - parquet
    FactorTypeEnum:
      enum:
      - split
      - cash_dividend
      - spin_off
      - other
      type: string
      description: |-
