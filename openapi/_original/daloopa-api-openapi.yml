        name:
          type: string
          description: Display name of the industry using Global Industry Classification
            Standard (GICS)
      required:
      - industry_id
      - name
    ValueErrorDetails:
      type: object
      properties:
        field_changed:
          type: string
          description: Name of the field that was corrected in the datapoint
        old_value:
          type: number
          format: double
          description: Value before the correction was applied
        new_value:
          type: number
          format: double
          description: Value after the correction was applied
        fundamental_id:
          type: integer
          description: Identifier of the affected fundamental datapoint
        series_id:
          type: integer
          description: Identifier of the related series for the datapoint
      required:
      - field_changed
      - fundamental_id
      - new_value
      - old_value
      - series_id
    WebhookCreateRequest:
      type: object
      description: |-
        Validates the payload for creating a new webhook.

        Required fields: ``url``, ``event_type``, ``is_test``.
        Optional fields: ``header_name``, ``prefix``, ``auth_secret``.
      properties:
        url:
          type: string
          format: uri
          minLength: 1
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        is_test:
          type: boolean
        header_name:
          type: string
          minLength: 1
        prefix:
          type: string
          minLength: 1
        auth_secret:
          type: string
          minLength: 1
      required:
      - event_type
      - is_test
      - url
    WebhookEventType:
      type: object
      description: Read-only representation of a supported webhook event type.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    WebhookFullRead:
      type: object
      description: |-
        Read-only serializer for webhook responses (list, retrieve, create, update).

        ``masked_auth_secret`` is a pre-computed field stored on the model that
        exposes only the last 4 characters of the auth secret (e.g. ``"****7890"``).
        Secrets of 4 or fewer characters are fully masked as ``"****"``. This avoids
        decrypting the auth secret on every read request.
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          type: string
        active:
          type: boolean
        is_test:
          type: boolean
        url:
          type: string
          format: uri
        header_name:
          type: string
        prefix:
          type: string
        masked_auth_secret:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active
      - created_at
      - event_type
      - header_name
      - id
      - is_test
      - masked_auth_secret
      - prefix
      - url
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: basic
      description: 'Basic authentication with base64-encoded credentials. Format:
        "Basic base64(email:apiKey)"'
