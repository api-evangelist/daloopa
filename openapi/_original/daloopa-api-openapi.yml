  /api/v3/companies/{company_id}/stock-prices:
    get:
      operationId: get_company_market_data
      description: Retrieve paginated daily OHLCV (Open, High, Low, Close, Volume)
        stock price data for a specific company.
      summary: Get Company Stock Prices
      parameters:
      - in: query
        name: adjusted
        schema:
          type: boolean
        description: 'Return adjusted prices when `true`; raw prices when `false`.
          Defaults to `false`. Adjusted prices restate history onto today''s per-share
          scale (the forward-adjustment convention): OHLC are multiplied by the cumulative
          factor of every stock split, cash dividend (including specials), and the
          price effect of spinoffs and distributions with an ex-date after the row''s
          date. Volume is adjusted only for share-count-changing splits and rounded
          to whole shares. Not provided: valuation of spun-off entities and reconstructed
          total-return series.'
        examples:
          AdjustedPrices:
            value: true
            summary: Adjusted Prices
          RawPrices:
            value: false
            summary: Raw Prices
      - in: path
        name: company_id
        schema:
          type: integer
        description: The unique identifier of the company.
        required: true
        examples:
          AppleInc.:
            value: 2
            summary: Apple Inc.
            description: Example company ID for Apple Inc.
      - in: query
        name: dates
        schema:
          type: array
          items:
            type: string
            format: date
        description: Specific dates to retrieve data for, passed as repeated keys
          (`?dates=2024-01-02&dates=2024-01-03`), up to 100 per request. Mutually
          exclusive with `start_date`/`end_date`; one of `dates` or `start_date` is
          required.
        explode: true
        examples:
          TwoSpecificDates:
            value:
            - '2024-01-02'
            - '2024-01-03'
            summary: Two specific dates
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date of the desired market data window (YYYY-MM-DD).
        examples:
          EndOf2024:
            value: '2024-12-31'
            summary: End of 2024
            description: Retrieve data up to the end of 2024.
      - in: query
        name: limit
        schema:
          type: integer
        description: Number of results to return per page.
      - in: query
        name: offset
        schema:
          type: integer
        description: The initial index from which to return results.
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date of the desired market data window (YYYY-MM-DD). Required
          unless `dates` is provided.
        examples:
          StartOf2024:
            value: '2024-01-01'
            summary: Start of 2024
            description: Retrieve data from the start of 2024.
      tags:
      - Market Data
      security:
      - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMarketDataList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                  status_code:
                    type: integer
                  message:
                    type: string
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: ''
  /api/v3/companies/{company_id}/adjustment-factors:
    get:
