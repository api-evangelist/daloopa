      - in: query
        name: fiscal_periods
        schema:
          type: array
          items:
            type: string
        description: List of fiscal periods to restrict returned series values (e.g.,
          2023Q1, 2023Q2). Mutually exclusive with `calendar_periods` and `periods`.
        examples:
