apis:
- name: Daloopa API v3
  description: >-
    REST API over Daloopa's fundamental dataset — company discovery, fundamental series and values,
    calendar/fiscal period handling, taxonomy metrics and industry templates, SEC document lookup,
    document content retrieval and keyword search, daily OHLCV stock prices, Excel model downloads,
    Parquet/CSV bulk export, consumption metering, data-warehouse subscription management, and a
    self-service webhook surface. 41 operations across 16 tags. Authenticated with HTTP Basic using
    base64(email:api_key).
  humanURL: https://docs.daloopa.com/docs/overview
  baseURL: https://app.daloopa.com/api/v3
