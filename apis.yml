aid: daloopa
name: Daloopa
description: >-
  Daloopa is an AI-powered fundamental financial data platform for institutional investors, providing
  analyst-verified, source-linked financial data extracted from SEC filings, earnings transcripts,
  investor presentations and press releases. Coverage spans 6,000+ global public companies with roughly
  14 years of history, and every datapoint is hyperlinked back to the exact location in the original
  source document for auditability. The company sells to hedge funds, mutual funds, investment banks,
  equity research and private equity teams, and delivers the same dataset across a REST API, a hosted
  remote MCP server, an Excel add-in, prebuilt Data Sheets, the Scout AI modeling agent, and native
  cloud-warehouse shares via Snowflake, Databricks and AWS S3.
url: https://raw.githubusercontent.com/api-evangelist/daloopa/refs/heads/main/apis.yml
