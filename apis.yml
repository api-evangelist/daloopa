- name: Daloopa MCP Server
  description: >-
    Hosted remote MCP server (Streamable HTTP) exposing nine tools over the same fundamental dataset —
    discover_companies, discover_company_series, discover_company_documents, get_company_fundamentals,
    get_document_content, search_documents, get_stock_prices, list_skills and get_skill. Every returned
    datapoint carries its source location. Authenticated via MCP OAuth 2.1 with dynamic client
    registration and PKCE, via a 24-hour bearer token minted from an API key, or via an X-API-KEY header.
  humanURL: https://docs.daloopa.com/docs/daloopa-mcp
  baseURL: https://mcp.daloopa.com/server/mcp
