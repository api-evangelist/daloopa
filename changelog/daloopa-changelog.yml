recommended_change_detection:
  - Diff https://app.daloopa.com/swagger.json — the live OpenAPI is publicly readable and unauthenticated, so it is a reliable machine-readable change oracle even without a changelog.
  - Poll POST /api/v3/companies/status for DATA freshness (this detects data change, not contract change).
  - Subscribe to webhooks for data events — see asyncapi/daloopa-webhooks.yml.

